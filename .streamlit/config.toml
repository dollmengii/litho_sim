[theme]
# 계측 장비 화면에 가깝게. 그래프가 대부분이라 바탕을 낮추면 선과 값이
# 떠오른다. 색을 고른 근거는 ui.py 의 설명에 적어 두었다.
base = "dark"
primaryColor = "#58A6FF"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#161A21"
textColor = "#C9D1D9"

[server]
headless = true
fileWatcherType = "auto"
maxUploadSize = 50
# 이 컴퓨터에서만 열린다. 같은 망의 다른 기기나 바깥에서 보려면
#   streamlit run app.py --server.address 0.0.0.0 --server.port 8501
# 공개 주소가 필요하면 배포_안내.md 를 볼 것.

[browser]
gatherUsageStats = false
