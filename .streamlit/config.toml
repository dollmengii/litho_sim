[theme]
# 14 주차에 어두운 '계측 장비' 풍에서 바꾸었다. 색은 공정에서 가져왔다 --
# 클린룸이 노란 조명인 이유는 레지스트가 청색·자외선에 반응하기 때문이고,
# ArF 는 193 nm 심자외선이다. 그래서 바탕은 따뜻한 종이색, 강조는 자외선
# 보라다. 근거와 규칙은 ui.py 의 설명에 적어 두었다.
# 이 값들은 ui.py 의 BG/SURF/TXT/ACCENT 와 **같아야 한다.** 둘이 어긋나면
# Streamlit 기본 위젯만 옛 색으로 남는다.
base = "light"
primaryColor = "#5B2BD9"
backgroundColor = "#FBF9F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15131A"

[server]
headless = true
fileWatcherType = "auto"
maxUploadSize = 50
# 이 컴퓨터에서만 열린다. 같은 망의 다른 기기나 바깥에서 보려면
#   streamlit run app.py --server.address 0.0.0.0 --server.port 8501
# 공개 주소가 필요하면 배포_안내.md 를 볼 것.

[browser]
gatherUsageStats = false
